<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Action Log RMC-2</title>
<link rel="manifest" href="manifest.json">

<style>
:root{
    --bg:#121212;
    --card:#1e1e1e;
    --accent:#00bcd4;
    --text:#e0e0e0;
    --muted:#9e9e9e;
    --ok:#4caf50;
    --danger:#e53935;
}

body{
    margin:0;
    font-family: Arial, sans-serif;
    background:var(--bg);
    color:var(--text);
}

header{
    background:#000;
    padding:16px;
    text-align:center;
    font-size:18px;
    font-weight:bold;
    border-bottom:2px solid var(--accent);
}

/* CONTENEDOR CENTRADO */
.container{
    max-width:420px;
    margin:0 auto;
}

/* TARJETAS GENERALES */
form, .filtro, .dashboard{
    background:var(--card);
    padding:15px;
    margin:12px;
    border-radius:10px;
}

/* INPUTS */
input, textarea, select, button{
    width:100%;
    margin-bottom:12px;
    padding:14px;
    font-size:16px;
    background:#2b2b2b;
    color:var(--text);
    border:1px solid #444;
    border-radius:8px;
}

/* BOTONES GRANDES PARA DEDO */
button{
    min-height:52px;
    background:var(--accent);
    color:#000;
    font-weight:bold;
    border:none;
}

button:active{
    transform: scale(0.98);
}

/* DASHBOARD */
.dashboard{
    display:grid;
    grid-template-columns: repeat(3,1fr);
    gap:10px;
    text-align:center;
}

.card{
    background:#000;
    padding:12px;
    border-radius:8px;
}

.card h2{
    margin:6px 0;
    color:var(--accent);
}

/* LISTA TAREAS */
.tareas{
    padding:10px;
}

.tarea{
    background:var(--card);
    margin-bottom:14px;
    padding:14px;
    border-radius:10px;
    border-left:5px solid var(--accent);
}

/* TAREA VENCIDA */
.tarea.vencida{
    border-left:5px solid var(--danger);
    background:#2a1414;
}

.tarea img{
    width:100%;
    border-radius:8px;
    margin-bottom:10px;
}

.fecha{
    font-size:13px;
    color:var(--muted);
}

/* BOTÓN CERRAR */
.cerrar{
    background:var(--ok);
    margin-top:10px;
    font-size:17px;
}
</style>
</head>

<body>

<header>Action Log Laboratorio RMC-2</header>

<div class="container">

    <div class="dashboard" id="dashboard"></div>

    <form id="form">
        <input id="titulo" placeholder="Título de la tarea" required>

        <select id="responsable" required>
            <option value="">Responsable</option>
            <option>Nicte Gaona</option>
            <option>Sergio Perez</option>
            <option>Pablo Rodriguez</option>
            <option>Daniel Reyes</option>
            <option>Pablo Amador</option>
            <option>David Garcia</option>
            <option>Josué Valdés</option>
        </select>

        <textarea id="descripcion" placeholder="Descripción breve" required></textarea>
        <input type="date" id="fecha" required>
        <input type="file" id="imagen" accept="image/*" capture="environment">
        <button>Agregar tarea</button>
    </form>

    <div class="filtro">
        <select id="filtroResponsable" onchange="mostrar()">
            <option value="">Ver pendientes por responsable</option>
            <option>Nicte Gaona</option>
            <option>Sergio Perez</option>
            <option>Pablo Rodriguez</option>
            <option>Daniel Reyes</option>
            <option>Pablo Amador</option>
            <option>David Garcia</option>
            <option>Josué Valdés</option>
        </select>
    </div>

    <div class="tareas" id="lista"></div>

</div>

<script>
let tareas = JSON.parse(localStorage.getItem("tareas")) || [];
const lista = document.getElementById("lista");
const dashboard = document.getElementById("dashboard");

// PERMISO NOTIFICACIONES
if ("Notification" in window && Notification.permission !== "granted") {
    Notification.requestPermission();
}

document.getElementById("form").addEventListener("submit", e => {
    e.preventDefault();
    const reader = new FileReader();
    const file = imagen.files[0];

    reader.onload = () => {
        tareas.push({
            titulo: titulo.value,
            responsable: responsable.value,
            descripcion: descripcion.value,
            fecha: fecha.value,
            imagen: reader.result || "",
            notificado:false
        });
        guardar();
        e.target.reset();
    };

    if(file) reader.readAsDataURL(file);
    else reader.onload();
});

function cerrarTarea(i){
    tareas.splice(i,1); // eliminar tarea cerrada
    guardar();
}

function guardar(){
    localStorage.setItem("tareas", JSON.stringify(tareas));
    mostrar();
    actualizarDashboard();
}

function actualizarDashboard(){
    dashboard.innerHTML = `
        <div class="card"><h2>${tareas.length}</h2>Pendientes</div>
        <div class="card"><h2>${[...new Set(tareas.map(t=>t.responsable))].length}</h2>Responsables</div>
        <div class="card"><h2>${new Date().toLocaleDateString()}</h2>Hoy</div>
    `;
}

function mostrar(){
    const filtro = document.getElementById("filtroResponsable").value;
    const hoy = new Date().toISOString().split("T")[0];
    lista.innerHTML = "";

    tareas.forEach((t,i)=>{
        if(filtro && t.responsable !== filtro) return;

        const vencida = t.fecha < hoy;
        lista.innerHTML += `
        <div class="tarea ${vencida ? "vencida":""}">
            ${t.imagen ? `<img src="${t.imagen}">` : ""}
            <h3>${t.titulo}</h3>
            <p><b>${t.responsable}</b></p>
            <p>${t.descripcion}</p>
            <p class="fecha">Cierre: ${t.fecha} ${vencida ? "⚠️ VENCIDA":""}</p>
            <button class="cerrar" onclick="cerrarTarea(${i})">Cerrar tarea</button>
        </div>`;
    });
}

// NOTIFICACIÓN 1 DÍA ANTES
setInterval(()=>{
    const hoy = new Date().toISOString().split("T")[0];
    tareas.forEach(t=>{
        const aviso = new Date(t.fecha);
        aviso.setDate(aviso.getDate()-1);
        const avisoStr = aviso.toISOString().split("T")[0];

        if(!t.notificado && avisoStr === hoy){
            new Notification("Tarea por vencer",{
                body:`${t.titulo} - ${t.responsable}`
            });
            t.notificado = true;
            guardar();
        }
    });
},60000);

mostrar();
actualizarDashboard();

if("serviceWorker" in navigator){
    navigator.serviceWorker.register("sw.js");
}
</script>

</body>
</html>
